schema: spec-driven
project: edge-ai-governance-iam-sod
strict_tdd: false

context: |
  Tech stack: Flutter (Dart) multi-platform frontend (Android, Windows Desktop) — Clean Architecture, BLoC state management, Atomic Design, Design Tokens.
  Backend: containerized microservices on Docker — Node.js (Express) or Python (FastAPI); PostgreSQL 16 primary (cloud) + edge replica (streaming replication).
  Edge AI: Ollama local SLM (Gemma 3 2B Q4_K_M / Phi-3-mini), MCP server (FastMCP), trilateral validation pipeline (Pydantic schema / actor-critic semantics / attribute-SoD), CapBAC tokens (Ed25519).
  Security: OIDC/OAuth 2.0 with PKCE, SCIM (RFC 7643/7644), FIDO2/WebAuthn MFA, JWT claims, AES-GCM-256 serialization, SHA-256 cryptographic ledger, BLE (flutter_blue_plus).
  Testing: no test runner scaffolded yet — repo has no source code. Planned: `flutter test` (widget/unit), `pytest` (services & scripts), stress/pentest scripts (qa_tests/, security_tests/).
  Style: thesis deliverables in Spanish (UTEQ); code identifiers, comments, UI strings in English. Semantic versioning vX.Y.Z per sprint (0..12); current v0.0.0. Ground truth: documento_maestro.md + arquitectura_y_algoritmos_ia.md.

