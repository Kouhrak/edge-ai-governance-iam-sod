rules:
  proposal:
    - Map every input spec to its thesis deliverable section (documento_maestro.md / arquitectura_y_algoritmos_ia.md).
    - State security implications (SoD, IAM, ledger integrity) when the change touches auth, roles, firmware injection, or audit logs.
    - Include rollback plan for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Write user stories with industrial context (rol, activo, accion) per documento_maestro.md.
  design:
    - Include Mermaid diagrams for complex flows (lifecycle: input spec -> history -> diagram -> prompt -> validation).
    - Document architecture decisions with rationale.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Follow per-sprint semantic commits: `feat(sprint-N): ...` / `test(sprint-N): ...` with version tags vX.Y.Z.
  apply:
    - Follow existing code patterns.
    - Docs stay in Spanish; code identifiers, comments, and UI strings in English.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
